name: Build Android APK
on: 
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        
      - name: Set up Java 
        uses: actions/setup-java@v4 
        with: 
          distribution: 'temurin' 
          java-version: '17' 
          
      - name: Set up Flutter 
        uses: subosito/flutter-action@v2 
        with: 
          channel: 'stable' 
          
      # 63855.jpg görselindeki nota istinaden eklenen adım:
      # API key dosyasının derleme öncesinde oluşturulması
      - name: Create api_keys.dart file
        run: |
          mkdir -p lib/data/repositories
          echo "${{ secrets.API_KEYS_FILE_CONTENT }}" > lib/data/repositories/api_keys.dart
          
      - name: Install dependencies 
        run: flutter pub get 
        
      - name: Build APK 
        run: flutter build apk --release 
        
      - name: Upload APK 
        uses: actions/upload-artifact@v4 
        with: 
          name: app-release 
          path: build/app/outputs/flutter-apk/app-release.apk
